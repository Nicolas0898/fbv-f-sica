<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="initial-scale=1.0">
    <title>Calculador de direçao eletromagnetismo</title>
    <link rel="stylesheet" href="./main.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
</head>

<body>
    <form class="container mt-3">
        <h1 class="text-center">Calculadora eletromagnetismo</h1>
        <img src="image.png" class="img-fluid rounded">
        <table class="table mt-3">
            <thead>
                <td>
                    <label for="forca">Direção da força</label>
                </td>
                <td>
                    <label for="campo">Direção densidade campo magnético</label>
                </td>
                <td>
                    <label for="velocidace">Direção velocidade</label>
                </td>
            </thead>
            <tr>
                <td>
                    <select class="form-control" id="forca" name="forca">
                        <option value="cima">Cima</option>
                        <option value="baixo">Baixo</option>
                        <option value="esquerda">Esquerda</option>
                        <option value="direita">Direita</option>
                        <option value="frente">Frente</option>
                        <option value="tras">Trás</option>
                        <option value="x">_</option>
                    </select>
                </td>
                <td>
                    <select class="form-control" id="campo" name="campo">
                        <option value="cima">Cima</option>
                        <option value="baixo">Baixo</option>
                        <option value="esquerda">Esquerda</option>
                        <option value="direita">Direita</option>
                        <option value="frente">Frente</option>
                        <option value="tras">Trás</option>
                        <option value="x">_</option>
                    </select>
                </td>
                <td>
                    <select class="form-control" id="velocidade" name="velocidade">
                        <option value="cima">Cima</option>
                        <option value="baixo">Baixo</option>
                        <option value="esquerda">Esquerda</option>
                        <option value="direita">Direita</option>
                        <option value="frente">Frente</option>
                        <option value="tras">Trás</option>
                        <option value="x" selected>_</option>
                    </select>
                </td>
            </tr>
            <tbody class="d-none" id="advancedmode">
                <tr>
                    <td>
                        <span class="text-center d-block w-100">X</span> <input id="forcax" class="form-control d-inline">
                    </td>
                    <td>
                        <span class="text-center d-block w-100">X</span> <input id="campox" class="form-control d-inline">
                    </td>
                    <td>
                        <span class="text-center d-block w-100">X</span> <input id="velocidadex" class="form-control d-inline">
                    </td>
                </tr>
                <tr>
                    <td>
                        <span class="text-center d-block w-100">Y</span> <input id="forcay" lass="form-control d-inline">
                    </td>
                    <td>
                        <span class="text-center d-block w-100">Y</span> <input id="campoy" class="form-control d-inline">
                    </td>
                    <td>
                        <span class="text-center d-block w-100">Y</span> <input id="velocidadey" class="form-control d-inline">
                    </td>
                </tr>
                <tr>
                    <td>
                        <span class="text-center d-block w-100">Z</span> <input id="forcaz" class="form-control d-inline">
                    </td>
                    <td>
                        <span class="text-center d-block w-100">Z</span> <input id="campoz" class="form-control d-inline">
                    </td>
                    <td>
                        <span class="text-center d-block w-100">Z</span> <input id="velocidadez" class="form-control d-inline">
                    </td>
                </tr>
            </tbody>
        </table>
        <br>

        <div class="alert alert-danger d-none" id="erroralert">
           <span id="errormsg"></span> 
        </div>
        <button id="calcbtn" type="button" class="btn btn-primary">Calcular</button>
        <div class="w-100">
            <h1>Resultado:</h1>
            <p>
                <span class="fw-bold">Vetor a ser calculado:</span> <span id="nomeresult"></span><br>
                <span class="fw-bold">Sentido:</span> <span id="dirresult"></span ><br>
                <span class="fw-bold">Vetor:</span> <span id="vectorresult"></span>

            </p>
        </div>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
        crossorigin="anonymous"></script>
    <script src="./main.js"></script>
</body>

</html>
